name: Deploy Global Rates

on:
  push:
    branches:
      - main
      - staging

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  APP_DISPLAY_NAME: ${{ vars.APP_DISPLAY_NAME }}
  APP_ROOT: ${{ vars.APP_ROOT }}
  APP_PORT: ${{ vars.APP_PORT }}
  APP_BASE_PATH: ${{ vars.APP_BASE_PATH }}
  APP_CONFIG_PATH: ${{ vars.APP_CONFIG_PATH }}
  ASG_NAME: ${{ vars.ASG_NAME }}
  GIT_BRANCH: ${{ vars.GIT_BRANCH }}
  PM2_APP_NAME: ${{ vars.PM2_APP_NAME }}
  REPO_URL: ${{ vars.REPO_URL }}

jobs:

  # ============================================================
  # 1. RESOLVE ENVIRONMENT
  # ============================================================

  resolve:
    name: Resolve deployment environment
    runs-on: ubuntu-latest

    outputs:
      environment: ${{ steps.resolve.outputs.environment }}

    steps:
      - name: Resolve environment
        id: resolve
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "environment=production" >> "${GITHUB_OUTPUT}"
          else
            echo "environment=staging" >> "${GITHUB_OUTPUT}"
          fi


  # ============================================================
  # 2. PREPARE
  # ============================================================

  prepare:
    name: Prepare deployment
    needs: resolve
    runs-on: ubuntu-latest

    environment:
      name: ${{ needs.resolve.outputs.environment }}

    outputs:
      instance_ids: ${{ steps.instances.outputs.instance_ids }}

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Find running EC2 instances
        id: instances
        shell: bash
        run: |
          set -euo pipefail

          echo "ASG: ${ASG_NAME}"

          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "${ASG_NAME}" \
            --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService` && HealthStatus==`Healthy`].InstanceId' \
            --output text)

          if [[ -z "${INSTANCE_IDS}" || "${INSTANCE_IDS}" == "None" ]]; then
            echo "ERROR: No healthy InService instances found"
            exit 1
          fi

          echo "Instances:"
          echo "${INSTANCE_IDS}"

          echo "instance_ids=${INSTANCE_IDS}" >> "${GITHUB_OUTPUT}"


  # ============================================================
  # 3. PREPARE SERVER
  # ============================================================

  server-prepare:
    name: Prepare server
    needs:
      - resolve
      - prepare

    runs-on: ubuntu-latest

    environment:
      name: ${{ needs.resolve.outputs.environment }}

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Prepare deployment
        uses: ./.github/actions/ssm-run
        with:
          phase: "Prepare server"
          instance-ids: ${{ needs.prepare.outputs.instance_ids }}
          script: |
            set -euo pipefail

            echo "Application: ${APP_DISPLAY_NAME}"
            echo "Application root: ${APP_ROOT}"
            echo "Config path: ${APP_CONFIG_PATH}"

            mkdir -p "${APP_ROOT}"

            if [[ ! -d "${APP_ROOT}/.git" ]]; then
              echo "Git repository does not exist yet."

              rm -rf "${APP_ROOT}"

              git clone \
                --branch "${GIT_BRANCH}" \
                "${REPO_URL}" \
                "${APP_ROOT}"

              FIRST_DEPLOY=true

            else
              echo "Existing Git repository detected."

              FIRST_DEPLOY=false
            fi

            echo "FIRST_DEPLOY=${FIRST_DEPLOY}" > "${STATE_FILE}"

            if [[ -d "${APP_ROOT}/node_modules" ]]; then
              echo "Backing up node_modules..."

              rm -rf "${NODE_MODULES_BACKUP}"

              mv \
                "${APP_ROOT}/node_modules" \
                "${NODE_MODULES_BACKUP}"
            fi

            if [[ -d "${APP_ROOT}/.next" ]]; then
              echo "Backing up .next build..."

              rm -rf "${BUILD_BACKUP}"

              mv \
                "${APP_ROOT}/.next" \
                "${BUILD_BACKUP}"
            fi


  # ============================================================
  # 4. SYNC GIT
  # ============================================================

  pull:
    name: Sync latest GitHub code
    needs:
      - resolve
      - prepare
      - server-prepare

    runs-on: ubuntu-latest

    environment:
      name: ${{ needs.resolve.outputs.environment }}

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync Git repository
        uses: ./.github/actions/ssm-run
        with:
          phase: "Sync latest GitHub code"
          instance-ids: ${{ needs.prepare.outputs.instance_ids }}
          script: |
            set -euo pipefail

            cd "${APP_ROOT}"

            echo "Repository: ${REPO_URL}"
            echo "Branch: ${GIT_BRANCH}"

            CURRENT_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "NONE")

            echo "Current commit:"
            echo "${CURRENT_COMMIT}"

            echo "Updating origin URL..."

            git remote set-url origin "${REPO_URL}"

            echo "Fetching latest GitHub branch..."

            git fetch origin "${GIT_BRANCH}"

            echo "Resetting repository to origin/${GIT_BRANCH}..."

            git reset --hard "origin/${GIT_BRANCH}"

            echo "Removing untracked files..."

            git clean -fd \
              -e node_modules_backup \
              -e .next_backup

            NEW_COMMIT=$(git rev-parse HEAD)

            echo "Previous commit:"
            echo "${CURRENT_COMMIT}"

            echo "New commit:"
            echo "${NEW_COMMIT}"

            cat >> "${STATE_FILE}" <<EOF
            PREVIOUS_COMMIT="${CURRENT_COMMIT}"
            DEPLOY_COMMIT="${NEW_COMMIT}"
            EOF

            echo "Git repository is now exactly synchronized with GitHub."


  # ============================================================
  # 5. RESTORE SERVER CONFIG
  # ============================================================

  restore-config:
    name: Restore application config
    needs:
      - resolve
      - prepare
      - pull

    runs-on: ubuntu-latest

    environment:
      name: ${{ needs.resolve.outputs.environment }}

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Restore config
        uses: ./.github/actions/ssm-run
        with:
          phase: "Restore application config"
          instance-ids: ${{ needs.prepare.outputs.instance_ids }}
          script: |
            set -euo pipefail

            echo "Config source:"
            echo "${APP_CONFIG_PATH}"

            if [[ ! -d "${APP_CONFIG_PATH}" ]]; then
              echo "ERROR: Application config directory does not exist:"
              echo "${APP_CONFIG_PATH}"
              exit 1
            fi

            echo "Restoring server-specific application files..."

            cp -a \
              "${APP_CONFIG_PATH}/." \
              "${APP_ROOT}/"

            echo "Restored files:"

            find "${APP_CONFIG_PATH}" \
              -type f \
              -print

            echo "Application config restored successfully."


  # ============================================================
  # 6. INSTALL DEPENDENCIES
  # ============================================================

  install:
    name: Install dependencies
    needs:
      - resolve
      - prepare
      - restore-config

    runs-on: ubuntu-latest

    environment:
      name: ${{ needs.resolve.outputs.environment }}

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install dependencies
        uses: ./.github/actions/ssm-run
        with:
          phase: "Install dependencies"
          instance-ids: ${{ needs.prepare.outputs.instance_ids }}
          script: |
            set -euo pipefail

            cd "${APP_ROOT}"

            echo "Node version:"
            node --version

            echo "npm version:"
            npm --version

            echo "Installing dependencies..."

            npm ci

            echo "npm ci completed successfully."


  # ============================================================
  # 7. BUILD
  # ============================================================

  build:
    name: Build application
    needs:
      - resolve
      - prepare
      - install

    runs-on: ubuntu-latest

    environment:
      name: ${{ needs.resolve.outputs.environment }}

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build application
        uses: ./.github/actions/ssm-run
        with:
          phase: "Build application"
          instance-ids: ${{ needs.prepare.outputs.instance_ids }}
          timeout: "1200"
          script: |
            set -euo pipefail

            cd "${APP_ROOT}"

            echo "Starting production build..."

            npm run build

            echo "Build completed successfully."


  # ============================================================
  # 8. RESTART PM2
  # ============================================================

  restart:
    name: Restart application
    needs:
      - resolve
      - prepare
      - build

    runs-on: ubuntu-latest

    environment:
      name: ${{ needs.resolve.outputs.environment }}

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Restart PM2
        uses: ./.github/actions/ssm-run
        with:
          phase: "Restart application"
          instance-ids: ${{ needs.prepare.outputs.instance_ids }}
          script: |
            set -euo pipefail

            cd "${APP_ROOT}"

            echo "Checking existing PM2 application..."

            if pm2 describe "${PM2_APP_NAME}" >/dev/null 2>&1; then

              echo "Reloading existing PM2 application..."

              pm2 reload "${PM2_APP_NAME}" --update-env

            else

              echo "PM2 application does not exist."

              echo "Starting application..."

              pm2 start npm \
                --name "${PM2_APP_NAME}" \
                --cwd "${APP_ROOT}" \
                -- start -- -p "${APP_PORT}"

            fi

            pm2 save

            echo "PM2 status:"

            pm2 status


  # ============================================================
  # 9. HEALTH CHECK
  # ============================================================

  health:
    name: Health check
    needs:
      - resolve
      - prepare
      - restart

    runs-on: ubuntu-latest

    environment:
      name: ${{ needs.resolve.outputs.environment }}

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Health check
        uses: ./.github/actions/ssm-run
        with:
          phase: "Health check"
          instance-ids: ${{ needs.prepare.outputs.instance_ids }}
          timeout: "180"
          script: |
            set -euo pipefail

            HEALTH_URL="http://127.0.0.1:${APP_PORT}/"

            echo "Health URL:"
            echo "${HEALTH_URL}"

            SUCCESS=false

            for i in {1..30}; do

              echo "Health check attempt ${i}/30..."

              if curl \
                --fail \
                --silent \
                --show-error \
                "${HEALTH_URL}" \
                >/dev/null; then

                SUCCESS=true
                break

              fi

              sleep 5

            done

            if [[ "${SUCCESS}" != "true" ]]; then
              echo "ERROR: Application health check failed."

              pm2 status || true
              pm2 logs "${PM2_APP_NAME}" --lines 100 --nostream || true

              exit 1
            fi

            echo "Application is healthy."


  # ============================================================
  # 10. CLEAN BACKUPS AFTER SUCCESS
  # ============================================================

  cleanup:
    name: Cleanup deployment backups
    needs:
      - resolve
      - prepare
      - health

    runs-on: ubuntu-latest

    environment:
      name: ${{ needs.resolve.outputs.environment }}

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Cleanup backups
        uses: ./.github/actions/ssm-run
        with:
          phase: "Cleanup deployment backups"
          instance-ids: ${{ needs.prepare.outputs.instance_ids }}
          script: |
            set -euo pipefail

            echo "Deployment successful."

            echo "Removing old node_modules backup..."

            rm -rf "${NODE_MODULES_BACKUP}"

            echo "Removing old .next backup..."

            rm -rf "${BUILD_BACKUP}"

            echo "Backups cleaned."


  # ============================================================
  # 11. ROLLBACK
  # ============================================================

  rollback:
    name: Rollback deployment
    needs:
      - resolve
      - prepare
      - pull
      - restore-config
      - install
      - build
      - restart
      - health

    if: ${{ failure() }}

    runs-on: ubuntu-latest

    environment:
      name: ${{ needs.resolve.outputs.environment }}

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Rollback application
        uses: ./.github/actions/ssm-run
        with:
          phase: "Rollback deployment"
          instance-ids: ${{ needs.prepare.outputs.instance_ids }}
          timeout: "600"
          script: |
            set -euo pipefail

            cd "${APP_ROOT}"

            echo "========================================"
            echo "ROLLBACK"
            echo "========================================"

            if [[ "${FIRST_DEPLOY:-false}" == "true" ]]; then

              echo "This was the first deployment."

              echo "No previous application version is available."

              exit 1
            fi

            if [[ -z "${PREVIOUS_COMMIT:-}" || "${PREVIOUS_COMMIT}" == "NONE" ]]; then

              echo "ERROR: Previous commit is not available."

              exit 1
            fi

            echo "Rolling back to:"
            echo "${PREVIOUS_COMMIT}"

            echo ""
            echo "Restoring previous Git commit..."

            git fetch origin "${GIT_BRANCH}"

            git reset --hard "${PREVIOUS_COMMIT}"

            git clean -fd \
              -e node_modules_backup \
              -e .next_backup

            echo ""
            echo "Restoring previous node_modules..."

            if [[ -d "${NODE_MODULES_BACKUP}" ]]; then

              rm -rf "${APP_ROOT}/node_modules"

              mv \
                "${NODE_MODULES_BACKUP}" \
                "${APP_ROOT}/node_modules"

            else

              echo "WARNING: node_modules backup not found."

            fi

            echo ""
            echo "Restoring previous .next build..."

            if [[ -d "${BUILD_BACKUP}" ]]; then

              rm -rf "${APP_ROOT}/.next"

              mv \
                "${BUILD_BACKUP}" \
                "${APP_ROOT}/.next"

            else

              echo "WARNING: .next backup not found."

            fi

            echo ""
            echo "Restoring server-specific config..."

            if [[ -d "${APP_CONFIG_PATH}" ]]; then

              cp -a \
                "${APP_CONFIG_PATH}/." \
                "${APP_ROOT}/"

            fi

            echo ""
            echo "Restarting previous version..."

            if pm2 describe "${PM2_APP_NAME}" >/dev/null 2>&1; then

              pm2 reload "${PM2_APP_NAME}" --update-env

            else

              pm2 start npm \
                --name "${PM2_APP_NAME}" \
                --cwd "${APP_ROOT}" \
                -- start -- -p "${APP_PORT}"

            fi

            pm2 save

            echo ""
            echo "Checking rollback health..."

            HEALTH_URL="http://127.0.0.1:${APP_PORT}/"

            SUCCESS=false

            for i in {1..30}; do

              if curl \
                --fail \
                --silent \
                --show-error \
                "${HEALTH_URL}" \
                >/dev/null; then

                SUCCESS=true
                break

              fi

              sleep 5

            done

            if [[ "${SUCCESS}" != "true" ]]; then

              echo "ERROR: Rollback health check failed."

              pm2 status || true
              pm2 logs "${PM2_APP_NAME}" --lines 100 --nostream || true

              exit 1
            fi

            echo ""
            echo "Rollback completed successfully."