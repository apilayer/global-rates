name: Deploy Global Rates

on:
  push:
    branches:
      - main
      - staging

  workflow_dispatch:

permissions:
  id-token: write
  contents: read


jobs:

  # ============================================================
  # 1. PREPARE
  # ============================================================

  prepare:
    name: Prepare deployment
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ASG_NAME: ${{ vars.ASG_NAME }}

    outputs:
      instance_ids: ${{ steps.instances.outputs.instance_ids }}

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Find running EC2 instances
        id: instances
        shell: bash
        run: |
          set -euo pipefail

          echo "ASG: ${ASG_NAME}"

          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:aws:autoscaling:groupName,Values=${ASG_NAME}" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)

          if [[ -z "${INSTANCE_IDS}" || "${INSTANCE_IDS}" == "None" ]]; then
            echo "ERROR: No running EC2 instances found."
            exit 1
          fi

          echo ""
          echo "Target instances:"
          echo "${INSTANCE_IDS}"

          echo "instance_ids=${INSTANCE_IDS}" >> "${GITHUB_OUTPUT}"


  # ============================================================
  # 2. DEPLOY
  # ============================================================

  deploy:
    name: Deploy application
    needs: prepare
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}

      APP_DISPLAY_NAME: ${{ vars.APP_DISPLAY_NAME }}
      APP_ROOT: ${{ vars.APP_ROOT }}
      APP_PORT: ${{ vars.APP_PORT }}
      APP_BASE_PATH: ${{ vars.APP_BASE_PATH }}
      APP_CONFIG_PATH: ${{ vars.APP_CONFIG_PATH }}

      GIT_BRANCH: ${{ vars.GIT_BRANCH }}
      PM2_APP_NAME: ${{ vars.PM2_APP_NAME }}
      REPO_URL: ${{ vars.REPO_URL }}

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}


      # --------------------------------------------------------
      # COMPLETE DEPLOYMENT
      # --------------------------------------------------------

      - name: Deploy
        uses: ./.github/actions/ssm-run
        with:
          phase: "Deploy ${APP_DISPLAY_NAME}"
          instance-ids: ${{ needs.prepare.outputs.instance_ids }}
          timeout: "1800"

          script: |
            set -euo pipefail

            echo "========================================"
            echo "DEPLOYMENT"
            echo "========================================"

            echo "Application : ${APP_DISPLAY_NAME}"
            echo "Root        : ${APP_ROOT}"
            echo "Branch      : ${GIT_BRANCH}"
            echo "Config      : ${APP_CONFIG_PATH}"
            echo "Repository  : ${REPO_URL}"

            mkdir -p "${APP_ROOT}"

            DEPLOY_NAME="$(basename "${APP_ROOT}")"

            DEPLOY_STATE_ROOT="/var/tmp/deploy-${DEPLOY_NAME}"
            STATE_FILE="${DEPLOY_STATE_ROOT}/state"

            NODE_MODULES_BACKUP="${DEPLOY_STATE_ROOT}/node_modules_backup"
            BUILD_BACKUP="${DEPLOY_STATE_ROOT}/next_backup"

            mkdir -p "${DEPLOY_STATE_ROOT}"

            # ==================================================
            # 1. CHECK / CLONE REPOSITORY
            # ==================================================

            if [[ ! -d "${APP_ROOT}/.git" ]]; then

              echo ""
              echo "Git repository does not exist."
              echo "Cloning ${GIT_BRANCH}..."

              rm -rf "${APP_ROOT}"

              git clone \
                --branch "${GIT_BRANCH}" \
                "${REPO_URL}" \
                "${APP_ROOT}"

              FIRST_DEPLOY=true
              PREVIOUS_COMMIT="NONE"

            else

              FIRST_DEPLOY=false

              cd "${APP_ROOT}"

              PREVIOUS_COMMIT=$(git rev-parse HEAD)

              echo ""
              echo "Current commit:"
              echo "${PREVIOUS_COMMIT}"

            fi


            # ==================================================
            # 2. SAVE DEPLOYMENT STATE
            # ==================================================

            cat > "${STATE_FILE}" <<EOF
            FIRST_DEPLOY="${FIRST_DEPLOY}"
            PREVIOUS_COMMIT="${PREVIOUS_COMMIT}"
            APP_ROOT="${APP_ROOT}"
            APP_CONFIG_PATH="${APP_CONFIG_PATH}"
            GIT_BRANCH="${GIT_BRANCH}"
            PM2_APP_NAME="${PM2_APP_NAME}"
            APP_PORT="${APP_PORT}"
            REPO_URL="${REPO_URL}"
            EOF


            # ==================================================
            # 3. BACKUP CURRENT NODE_MODULES
            # ==================================================

            if [[ -d "${APP_ROOT}/node_modules" ]]; then

              echo ""
              echo "Backing up node_modules..."

              rm -rf "${NODE_MODULES_BACKUP}"

              mv \
                "${APP_ROOT}/node_modules" \
                "${NODE_MODULES_BACKUP}"

            else

              echo ""
              echo "No node_modules directory found."

            fi


            # ==================================================
            # 4. BACKUP CURRENT NEXT BUILD
            # ==================================================

            if [[ -d "${APP_ROOT}/.next" ]]; then

              echo ""
              echo "Backing up .next..."

              rm -rf "${BUILD_BACKUP}"

              mv \
                "${APP_ROOT}/.next" \
                "${BUILD_BACKUP}"

            else

              echo ""
              echo "No .next directory found."

            fi


            # ==================================================
            # 5. SYNC EXACTLY WITH GITHUB
            # ==================================================

            cd "${APP_ROOT}"

            echo ""
            echo "========================================"
            echo "SYNCING GITHUB"
            echo "========================================"

            git remote set-url origin "${REPO_URL}"

            echo "Fetching latest ${GIT_BRANCH}..."

            git fetch origin "${GIT_BRANCH}"

            echo ""
            echo "Resetting to origin/${GIT_BRANCH}..."

            git reset --hard "origin/${GIT_BRANCH}"

            echo ""
            echo "Removing untracked files..."

            git clean -fd

            echo ""
            echo "Repository is now synchronized."

            DEPLOY_COMMIT=$(git rev-parse HEAD)

            echo ""
            echo "Deploy commit:"
            echo "${DEPLOY_COMMIT}"

            cat >> "${STATE_FILE}" <<EOF
            DEPLOY_COMMIT="${DEPLOY_COMMIT}"
            EOF


            # ==================================================
            # 6. RESTORE SERVER-SPECIFIC CONFIG
            # ==================================================

            echo ""
            echo "========================================"
            echo "RESTORING APPLICATION CONFIG"
            echo "========================================"

            if [[ ! -d "${APP_CONFIG_PATH}" ]]; then

              echo "ERROR: Application config directory does not exist:"
              echo "${APP_CONFIG_PATH}"

              exit 1

            fi

            cp -a \
              "${APP_CONFIG_PATH}/." \
              "${APP_ROOT}/"

            echo ""
            echo "Application-specific files restored."

            echo ""
            echo "Config files:"

            find "${APP_CONFIG_PATH}" \
              -type f \
              -print


            # ==================================================
            # 7. INSTALL DEPENDENCIES
            # ==================================================

            cd "${APP_ROOT}"

            echo ""
            echo "========================================"
            echo "INSTALLING DEPENDENCIES"
            echo "========================================"

            echo "Node:"
            node --version

            echo "npm:"
            npm --version

            npm ci


            # ==================================================
            # 8. BUILD
            # ==================================================

            echo ""
            echo "========================================"
            echo "BUILDING APPLICATION"
            echo "========================================"

            npm run build


            # ==================================================
            # 9. RESTART PM2
            # ==================================================

            echo ""
            echo "========================================"
            echo "RESTARTING PM2"
            echo "========================================"

            if pm2 describe "${PM2_APP_NAME}" >/dev/null 2>&1; then

              echo "Existing PM2 process found."

              pm2 reload "${PM2_APP_NAME}" --update-env

            else

              echo "PM2 process does not exist."

              pm2 start npm \
                --name "${PM2_APP_NAME}" \
                --cwd "${APP_ROOT}" \
                -- start -- -p "${APP_PORT}"

            fi

            pm2 save

            pm2 status


            # ==================================================
            # 10. HEALTH CHECK
            # ==================================================

            echo ""
            echo "========================================"
            echo "HEALTH CHECK"
            echo "========================================"

            HEALTH_URL="http://127.0.0.1:${APP_PORT}/"

            echo "Health URL:"
            echo "${HEALTH_URL}"

            HEALTHY=false

            for i in {1..30}; do

              echo "Health check ${i}/30..."

              if curl \
                --fail \
                --silent \
                --show-error \
                "${HEALTH_URL}" \
                >/dev/null; then

                HEALTHY=true
                break

              fi

              sleep 5

            done

            if [[ "${HEALTHY}" != "true" ]]; then

              echo ""
              echo "ERROR: Health check failed."

              echo ""
              echo "PM2 status:"

              pm2 status || true

              echo ""
              echo "PM2 logs:"

              pm2 logs \
                "${PM2_APP_NAME}" \
                --lines 100 \
                --nostream || true

              exit 1

            fi

            echo ""
            echo "Health check passed."


            # ==================================================
            # 11. CLEAN OLD BACKUPS
            # ==================================================

            echo ""
            echo "========================================"
            echo "CLEANUP"
            echo "========================================"

            rm -rf "${NODE_MODULES_BACKUP}"
            rm -rf "${BUILD_BACKUP}"

            echo "Deployment completed successfully."


  # ============================================================
  # 3. ROLLBACK
  # ============================================================

  rollback:
    name: Rollback deployment
    needs:
      - prepare
      - deploy

    if: ${{ needs.deploy.result == 'failure' }}

    runs-on: ubuntu-latest

    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}

      APP_DISPLAY_NAME: ${{ vars.APP_DISPLAY_NAME }}
      APP_ROOT: ${{ vars.APP_ROOT }}
      APP_PORT: ${{ vars.APP_PORT }}
      APP_CONFIG_PATH: ${{ vars.APP_CONFIG_PATH }}

      GIT_BRANCH: ${{ vars.GIT_BRANCH }}
      PM2_APP_NAME: ${{ vars.PM2_APP_NAME }}
      REPO_URL: ${{ vars.REPO_URL }}

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Rollback
        uses: ./.github/actions/ssm-run
        with:
          phase: "Rollback ${APP_DISPLAY_NAME}"
          instance-ids: ${{ needs.prepare.outputs.instance_ids }}
          timeout: "900"

          script: |
            set -euo pipefail

            echo "========================================"
            echo "ROLLBACK"
            echo "========================================"

            DEPLOY_NAME="$(basename "${APP_ROOT}")"

            DEPLOY_STATE_ROOT="/var/tmp/deploy-${DEPLOY_NAME}"
            STATE_FILE="${DEPLOY_STATE_ROOT}/state"

            NODE_MODULES_BACKUP="${DEPLOY_STATE_ROOT}/node_modules_backup"
            BUILD_BACKUP="${DEPLOY_STATE_ROOT}/next_backup"

            if [[ ! -f "${STATE_FILE}" ]]; then

              echo "ERROR: Deployment state was not found:"
              echo "${STATE_FILE}"

              exit 1

            fi

            source "${STATE_FILE}"

            echo "Previous commit:"
            echo "${PREVIOUS_COMMIT:-NONE}"


            # ==================================================
            # FIRST DEPLOYMENT
            # ==================================================

            if [[ "${FIRST_DEPLOY:-false}" == "true" ]]; then

              echo ""
              echo "This was the first deployment."
              echo "There is no previous version to restore."

              exit 1

            fi


            if [[ -z "${PREVIOUS_COMMIT:-}" || "${PREVIOUS_COMMIT}" == "NONE" ]]; then

              echo "ERROR: Previous commit is unavailable."

              exit 1

            fi


            cd "${APP_ROOT}"


            # ==================================================
            # 1. RESTORE PREVIOUS GIT VERSION
            # ==================================================

            echo ""
            echo "Restoring previous Git commit..."

            git fetch origin "${GIT_BRANCH}"

            git reset --hard "${PREVIOUS_COMMIT}"

            git clean -fd


            # ==================================================
            # 2. RESTORE NODE_MODULES
            # ==================================================

            echo ""
            echo "Restoring previous node_modules..."

            rm -rf "${APP_ROOT}/node_modules"

            if [[ -d "${NODE_MODULES_BACKUP}" ]]; then

              mv \
                "${NODE_MODULES_BACKUP}" \
                "${APP_ROOT}/node_modules"

            else

              echo "WARNING: node_modules backup not found."

            fi


            # ==================================================
            # 3. RESTORE PREVIOUS BUILD
            # ==================================================

            echo ""
            echo "Restoring previous .next..."

            rm -rf "${APP_ROOT}/.next"

            if [[ -d "${BUILD_BACKUP}" ]]; then

              mv \
                "${BUILD_BACKUP}" \
                "${APP_ROOT}/.next"

            else

              echo "WARNING: .next backup not found."

            fi


            # ==================================================
            # 4. RESTORE SERVER CONFIG
            # ==================================================

            echo ""
            echo "Restoring application-specific config..."

            if [[ -d "${APP_CONFIG_PATH}" ]]; then

              cp -a \
                "${APP_CONFIG_PATH}/." \
                "${APP_ROOT}/"

            else

              echo "WARNING: Application config path not found."

            fi


            # ==================================================
            # 5. RESTART PM2
            # ==================================================

            echo ""
            echo "Restarting PM2..."

            if pm2 describe "${PM2_APP_NAME}" >/dev/null 2>&1; then

              pm2 reload "${PM2_APP_NAME}" --update-env

            else

              pm2 start npm \
                --name "${PM2_APP_NAME}" \
                --cwd "${APP_ROOT}" \
                -- start -- -p "${APP_PORT}"

            fi

            pm2 save


            # ==================================================
            # 6. ROLLBACK HEALTH CHECK
            # ==================================================

            echo ""
            echo "Checking rollback health..."

            HEALTH_URL="http://127.0.0.1:${APP_PORT}/"

            HEALTHY=false

            for i in {1..30}; do

              echo "Rollback health check ${i}/30..."

              if curl \
                --fail \
                --silent \
                --show-error \
                "${HEALTH_URL}" \
                >/dev/null; then

                HEALTHY=true
                break

              fi

              sleep 5

            done

            if [[ "${HEALTHY}" != "true" ]]; then

              echo ""
              echo "ERROR: Rollback health check failed."

              pm2 status || true

              pm2 logs \
                "${PM2_APP_NAME}" \
                --lines 100 \
                --nostream || true

              exit 1

            fi

            echo ""
            echo "========================================"
            echo "ROLLBACK COMPLETED"
            echo "========================================"