name: GlobalRates - Staging CI/CD

on:
  push:
    branches:
      - staging

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  APP_ROOT: /var/www/devtools/global-rates
  GIT_BRANCH: staging
  PM2_APP_NAME: globalrates
  APP_PORT: "3004"

jobs:
  deploy:
    name: Deploy GlobalRates to Staging
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check GitHub context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"

      # 2. Authenticate to AWS using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # 3. Find one running EC2 instance from ASG
      - name: Find staging EC2 instance
        id: instance
        env:
          ASG_NAME: ${{ vars.ASG_NAME }}

        run: |

          echo "Finding running EC2 instance..."

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:aws:autoscaling:groupName,Values=${ASG_NAME}" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId | [0]' \
            --output text)

          if [[ -z "${INSTANCE_ID}" || "${INSTANCE_ID}" == "None" ]]; then
            echo "ERROR: No running EC2 instance found for ASG."
            exit 1
          fi

          echo "Target EC2 instance: ${INSTANCE_ID}"

          echo "instance_id=${INSTANCE_ID}" >> "${GITHUB_OUTPUT}"

      # 4. Send deployment command to EC2 using SSM
      - name: Start deployment
        id: deployment
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        run: |
          echo "Starting deployment on ${INSTANCE_ID}..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "GlobalRates staging deployment ${GITHUB_SHA}" \
            --parameters 'commands=[
              "bash -s <<'\''DEPLOY_SCRIPT'\''",
              "set -u",
              "APP_ROOT=\"/var/www/devtools/global-rates\"",
              "GIT_BRANCH=\"staging\"",
              "PM2_APP_NAME=\"globalrates\"",
              "APP_PORT=\"3004\"",
              "NODE_MODULES_BACKUP=\"${APP_ROOT}/node_modules_backup\"",
              "export HOME=\"/root\"",
              "export NVM_DIR=\"/root/.nvm\"",
              "source /root/.nvm/nvm.sh",
              "nvm use 20",
              "cd \"${APP_ROOT}\" || exit 1",
              "echo \"========================================\"",
              "echo \"Starting GlobalRates deployment\"",
              "echo \"========================================\"",
              "echo \"Saving current commit...\"",
              "PREVIOUS_COMMIT=$(git rev-parse HEAD)",
              "echo \"Previous commit: ${PREVIOUS_COMMIT}\"",
              "echo \"Backing up node_modules...\"",
              "if [[ -d \"${APP_ROOT}/node_modules\" ]]; then",
              "  echo \"Existing node_modules found.\"",
              "  echo \"Backing up node_modules...\"",
              "  rm -rf \"${NODE_MODULES_BACKUP}\"",
              "  mv \"${APP_ROOT}/node_modules\" \"${NODE_MODULES_BACKUP}\"",
              "  NODE_MODULES_BACKUP_CREATED=true",
              "  echo \"node_modules backup created.\"",
              "else",
              "  echo \"No existing node_modules found.\"",
              "  echo \"Skipping node_modules backup.\"",
              "  NODE_MODULES_BACKUP_CREATED=false",
              "fi",
              "echo \"Pulling latest ${GIT_BRANCH} code...\"",
              "if ! git pull origin \"${GIT_BRANCH}\"; then",
              "  echo \"ERROR: git pull failed.\"",
              "  echo \"Restoring node_modules...\"",
              "  rm -rf \"${APP_ROOT}/node_modules\"",
              "  if [[ -d \"${NODE_MODULES_BACKUP}\" ]]; then",
              "    mv \"${NODE_MODULES_BACKUP}\" \"${APP_ROOT}/node_modules\"",
              "  fi",
              "  exit 1",
              "fi",
              "CURRENT_COMMIT=$(git rev-parse HEAD)",
              "echo \"Current commit: ${CURRENT_COMMIT}\"",
              "ROLLBACK_REQUIRED=false",
              "echo \"Installing dependencies...\"",
              "if ! npm ci; then",
              "  echo \"ERROR: npm ci failed.\"",
              "  ROLLBACK_REQUIRED=true",
              "fi",
              "if [[ \"${ROLLBACK_REQUIRED}\" == \"false\" ]]; then",
              "  echo \"Reloading PM2...\"",
              "  if ! pm2 reload \"${PM2_APP_NAME}\"; then",
              "    echo \"ERROR: PM2 reload failed.\"",
              "    ROLLBACK_REQUIRED=true",
              "  fi",
              "fi",
              "if [[ \"${ROLLBACK_REQUIRED}\" == \"false\" ]]; then",
              "  echo \"Running health check...\"",
              "  HEALTH_OK=false",
              "  for attempt in {1..30}; do",
              "    if curl --fail --silent --show-error \"http://127.0.0.1:${APP_PORT}/\" > /dev/null; then",
              "      HEALTH_OK=true",
              "      break",
              "    fi",
              "    echo \"Health check attempt ${attempt}/30 failed.\"",
              "    sleep 2",
              "  done",
              "  if [[ \"${HEALTH_OK}\" != \"true\" ]]; then",
              "    echo \"ERROR: Health check failed.\"",
              "    ROLLBACK_REQUIRED=true",
              "  fi",
              "fi",
              "if [[ \"${ROLLBACK_REQUIRED}\" == \"false\" ]]; then",
              "  echo \"========================================\"",
              "  echo \"DEPLOYMENT SUCCESSFUL\"",
              "  echo \"========================================\"",
              "  echo \"Previous commit: ${PREVIOUS_COMMIT}\"",
              "  echo \"Current commit: ${CURRENT_COMMIT}\"",
              "  echo \"Keeping node_modules backup for rollback:\"",
              "  echo \"${NODE_MODULES_BACKUP}\"",
              "  exit 0",
              "fi",

              "echo \"========================================\"",
              "echo \"ROLLBACK STARTING\"",
              "echo \"========================================\"",

              "echo \"Restoring commit: ${PREVIOUS_COMMIT}\"",

              "echo \"Stopping application...\"",

              "pm2 stop \"${PM2_APP_NAME}\" || true",

              "echo \"Restoring previous Git commit...\"",

              "git reset --hard \"${PREVIOUS_COMMIT}\"",

              "echo \"Restoring previous node_modules...\"",

              "rm -rf \"${APP_ROOT}/node_modules\"",

              "if [[ \"${NODE_MODULES_BACKUP_CREATED}\" != \"true\" ]]; then",
              "  echo \"ERROR: No previous node_modules backup exists.\"",
              "  exit 1",
              "fi",

              "if [[ ! -d \"${NODE_MODULES_BACKUP}\" ]]; then",
              "  echo \"ERROR: node_modules backup not found.\"",
              "  exit 1",
              "fi",

              "mv \"${NODE_MODULES_BACKUP}\" \"${APP_ROOT}/node_modules\"",

              "echo \"Reloading previous version...\"",

              "if ! pm2 reload \"${PM2_APP_NAME}\"; then",
              "  echo \"ERROR: PM2 rollback reload failed.\"",
              "  exit 1",
              "fi",

              "echo \"Checking rolled-back application...\"",

              "ROLLBACK_HEALTH_OK=false",

              "for attempt in {1..30}; do",

              "  if curl --fail --silent --show-error \"http://127.0.0.1:${APP_PORT}/\" > /dev/null; then",
              "    ROLLBACK_HEALTH_OK=true",
              "    break",
              "  fi",

              "  echo \"Rollback health check attempt ${attempt}/30 failed.\"",
              "  sleep 2",

              "done",

              "if [[ \"${ROLLBACK_HEALTH_OK}\" != \"true\" ]]; then",

              "  echo \"========================================\"",
              "  echo \"ROLLBACK FAILED\"",
              "  echo \"========================================\"",

              "  exit 1",

              "fi",

              "echo \"========================================\"",
              "echo \"ROLLBACK SUCCESSFUL\"",
              "echo \"========================================\"",

              "echo \"Application restored to: ${PREVIOUS_COMMIT}\"",

              "exit 1",

              "DEPLOY_SCRIPT"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: ${COMMAND_ID}"

          echo "command_id=${COMMAND_ID}" >> "${GITHUB_OUTPUT}"

      # 5. Wait for deployment result
      - name: Wait for deployment
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
          COMMAND_ID: ${{ steps.deployment.outputs.command_id }}

        run: |

          echo "Waiting for deployment result..."

          for attempt in {1..60}; do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query 'Status' \
              --output text)

            echo "Deployment status: ${STATUS}"

            case "${STATUS}" in

              Success)

                echo
                echo "========================================"
                echo "DEPLOYMENT SUCCESSFUL"
                echo "========================================"

                echo
                echo "Deployment output:"

                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${INSTANCE_ID}" \
                  --query 'StandardOutputContent' \
                  --output text

                exit 0
                ;;

              Failed|Cancelled|TimedOut|Cancelling)

                echo
                echo "========================================"
                echo "DEPLOYMENT FAILED"
                echo "========================================"

                echo
                echo "Deployment output:"

                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${INSTANCE_ID}" \
                  --query 'StandardOutputContent' \
                  --output text

                echo
                echo "Error output:"

                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${INSTANCE_ID}" \
                  --query 'StandardErrorContent' \
                  --output text

                exit 1
                ;;

            esac

            sleep 5

          done

          echo
          echo "ERROR: Deployment timed out."

          exit 1
